# Locked test of the LateTVG baseline on Waterbirds (Hamidieh et al., ICLR 2024).
#
# The selection stage (waterbirds_latetvg.yaml, validation probes, seed 1) put prune rate 0.9 first:
# last-four validation WGA 47.9 at 0.9, 47.4 at 0.7 and 45.5 at 0.5, all five layer4 convolutions pruned.
# This manifest predeclares that configuration and runs it only under the locked-test protocol, one probe
# on the test split after SSL epoch 500, on seeds 1 to 6 like the concept-factor locked test
# (factors_waterbirds_test, launched with FINAL_TEST=1). The training protocol matches the factor studies
# (--preset matched: batch 128, temperature 0.05, the same SGD schedule, augmentations and logistic probe).
#
#   bash scripts/submit_experiment.sh experiments/manifests/waterbirds_latetvg_test.yaml --locked-test

name: waterbirds_latetvg_test
description: LateTVG (prune rate 0.9, five layer4 convolutions) on the Waterbirds locked test, seeds 1 to 6.
seeds: [1, 2, 3, 4, 5, 6]
flags: [use_wandb]
common:
  dataset: waterbirds
  data_folder: ${DATA_FOLDER}
  model: resnet18_large
  epochs: 500
  batch_size: 128
  num_workers: 4
  learning_rate: 0.01
  optimizer: SGD
  temp: 0.05
  weight_decay: 0.0001
  momentum: 0.9
  ssl_crop_min: 0.2
  linear_probe_solver: logistic
  linear_probe_l2: 0.001
  linear_probe_tolerance: 1.0e-06
  linear_probe_max_epochs: 200
  train_set_linear_layer: ds_train
  linear_eval_split: val
  linear_probe_mode: periodic
  linear_probe_freq: 25
  linear_spurious_probe: true
  delete_checkpoints_after_training: true
  retain_probe_artifacts_every: 0
  wandb_name: CoSpRo
  wandb_group: waterbirds_latetvg_test
  wandb_tags: baseline,waterbirds,latetvg,locked_test
locked_test:
  description: 'Predeclared held-out evaluation: one group-balanced logistic probe at SSL epoch 500.'
  flags: [final_test]
  args:
    linear_eval_split: test
    linear_probe_mode: final
    linear_probe_freq: 0
arms:
  latetvg:
    args:
      splice_mode: none
      splice_weight: 0
      latetvg_prune_rate: 0.9
      latetvg_layers: 5
