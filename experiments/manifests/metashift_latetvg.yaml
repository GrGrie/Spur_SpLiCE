# LateTVG (Hamidieh et al., ICLR 2024) on MetaShift: prune-rate selection on validation probes.
#
# The second SimCLR view passes through an encoder whose last `latetvg_layers` convolutions lose the
# `latetvg_prune_rate` smallest-magnitude weights. Rates 0.5, 0.7 and 0.9 over all five layer4 convolutions,
# seeds 1 and 2, periodic validation probes, under the training protocol of the factor studies
# (--preset matched). The rate with the best mean last-four validation WGA goes into a locked-test manifest
# like waterbirds_latetvg_test.yaml. The paper reports MetaShift WGA 45.5 for SimCLR and 59.3 for LateTVG
# at its best grid point.
#
#   bash scripts/submit_experiment.sh experiments/manifests/metashift_latetvg.yaml

name: metashift_latetvg
description: LateTVG prune-rate selection on MetaShift validation.
seeds: [1, 2]
flags: [use_wandb]
common:
  dataset: metashift
  data_folder: ${DATA_FOLDER}
  model: resnet18_large
  epochs: 500
  batch_size: 128
  num_workers: 4
  learning_rate: 0.01
  optimizer: SGD
  temp: 0.05
  weight_decay: 0.0001
  momentum: 0.9
  ssl_crop_min: 0.2
  linear_probe_solver: logistic
  linear_probe_l2: 0.001
  linear_probe_tolerance: 1.0e-06
  linear_probe_max_epochs: 200
  train_set_linear_layer: ds_train
  linear_eval_split: val
  linear_probe_mode: periodic
  linear_probe_freq: 25
  linear_spurious_probe: true
  delete_checkpoints_after_training: true
  retain_probe_artifacts_every: 0
  wandb_name: CoSpRo
  wandb_group: metashift_latetvg
  wandb_tags: baseline,metashift,latetvg
locked_test:
  description: 'Predeclared held-out evaluation: one group-balanced logistic probe at SSL epoch 500.'
  flags: [final_test]
  args:
    linear_eval_split: test
    linear_probe_mode: final
    linear_probe_freq: 0
arms:
  latetvg:
    args:
      splice_mode: none
      splice_weight: 0
      latetvg_prune_rate: 0.7
      latetvg_layers: 5
# The base arm holds rate 0.7; the sweep adds rates 0.5 and 0.9.
sweeps:
  latetvg:
    base: latetvg
    grid:
      latetvg_prune_rate: [0.5, 0.9]
