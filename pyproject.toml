[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cospro"
version = "0.1.0"
description = "CoSpRo: concept-subspace projection teachers for spurious-correlation-robust self-supervised learning"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8"]
paper = ["matplotlib", "reportlab"]
diagnostics = ["matplotlib"]
data = ["gdown"]

[tool.setuptools]
py-modules = ["spur_splice"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["cospro*", "third_party*", "splice*", "experiments*", "scripts*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
