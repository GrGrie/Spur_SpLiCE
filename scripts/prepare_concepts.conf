# CoBalT Stage-1 concept discovery configuration.
# Edit values here, then run:
#   sbatch CoBalT/scripts/prepare_concepts.sbatch

PROJECT_DIR="${PROJECT_DIR:-/home/xar68reb/Spur_SpLiCE}"
CONDA_ENV="${CONDA_ENV:-grgrie-train}"
DATA_FOLDER="${DATA_FOLDER:-/home/xar68reb/Datasets}"
DATASET="${DATASET:-waterbirds}"
SEED="${SEED:-${SLURM_ARRAY_TASK_ID:-0}}"
NUM_WORKERS="${NUM_WORKERS:-5}"
WANDB_PROJECT="${WANDB_PROJECT:-Spur_SpLiCE}"
WANDB_ENTITY="${WANDB_ENTITY:-gsgrechkin-rptu}"

# resnet18_large is the project's large-input ResNet-18 variant. CoBalT's
# internal name for the same stem/layer layout is simply resnet18.
COBALT_MODEL="${COBALT_MODEL:-resnet18_large}"
COBALT_EPOCHS="${COBALT_EPOCHS:-50}"
COBALT_BATCH_SIZE="${COBALT_BATCH_SIZE:-128}"
COBALT_IMAGE_SIZE="${COBALT_IMAGE_SIZE:-224}"
COBALT_CROP_MIN="${COBALT_CROP_MIN:-0.2}"
COBALT_NUM_SLOTS="${COBALT_NUM_SLOTS:-4}"
COBALT_CODEBOOK_SIZE="${COBALT_CODEBOOK_SIZE:-8}"
COBALT_SLOT_DIM="${COBALT_SLOT_DIM:-32}"
COBALT_HIDDEN_DIM="${COBALT_HIDDEN_DIM:-1024}"
COBALT_LEARNING_RATE="${COBALT_LEARNING_RATE:-2e-4}"
COBALT_WEIGHT_DECAY="${COBALT_WEIGHT_DECAY:-5e-4}"
COBALT_STUDENT_TEMPERATURE="${COBALT_STUDENT_TEMPERATURE:-0.1}"
COBALT_TEACHER_TEMPERATURE="${COBALT_TEACHER_TEMPERATURE:-0.07}"
COBALT_CONTRASTIVE_TEMPERATURE="${COBALT_CONTRASTIVE_TEMPERATURE:-0.2}"
COBALT_TEACHER_MOMENTUM="${COBALT_TEACHER_MOMENTUM:-0.99}"
COBALT_CODEBOOK_MOMENTUM="${COBALT_CODEBOOK_MOMENTUM:-0.9}"
COBALT_CENTER_MOMENTUM="${COBALT_CENTER_MOMENTUM:-0.9}"
COBALT_AMP="${COBALT_AMP:-true}"
COBALT_MAX_STEPS_PER_EPOCH="${COBALT_MAX_STEPS_PER_EPOCH:-}"
