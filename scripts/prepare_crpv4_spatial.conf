# CRPv4 spatial evidence preparation. The launcher runs the four bounded ablations.
PROJECT_DIR="${PROJECT_DIR:-/home/xar68reb/Spur_SpLiCE}"
CONDA_ENV="${CONDA_ENV:-grgrie-train}"
DATA_FOLDER="${DATA_FOLDER:-/home/xar68reb/Datasets}"
DATASET="${DATASET:-waterbirds}"
SEED="${SEED:-0}"
NUM_WORKERS="${NUM_WORKERS:-5}"
CRP_CACHE_PATH="${CRP_CACHE_PATH:-outputs/crp/${DATASET}_train_features.pt}"

CRPV4_EPOCHS="${CRPV4_EPOCHS:-50}"
CRPV4_BATCH_SIZE="${CRPV4_BATCH_SIZE:-64}"
CRPV4_IMAGE_SIZE="${CRPV4_IMAGE_SIZE:-224}"
CRPV4_CROP_MIN="${CRPV4_CROP_MIN:-0.2}"
CRPV4_NUM_SLOTS="${CRPV4_NUM_SLOTS:-4}"
CRPV4_CONCEPTS_PER_REGION="${CRPV4_CONCEPTS_PER_REGION:-4}"
CRPV4_LEARNING_RATE="${CRPV4_LEARNING_RATE:-2e-4}"
CRPV4_WEIGHT_DECAY="${CRPV4_WEIGHT_DECAY:-5e-4}"
CRPV4_STUDENT_TEMPERATURE="${CRPV4_STUDENT_TEMPERATURE:-0.1}"
CRPV4_TEACHER_TEMPERATURE="${CRPV4_TEACHER_TEMPERATURE:-0.07}"
CRPV4_TEACHER_MOMENTUM="${CRPV4_TEACHER_MOMENTUM:-0.99}"
CRPV4_CENTER_MOMENTUM="${CRPV4_CENTER_MOMENTUM:-0.9}"
CRPV4_SEMANTIC_WEIGHT="${CRPV4_SEMANTIC_WEIGHT:-1.0}"
CRPV4_AMP="${CRPV4_AMP:-true}"
CRPV4_MAX_STEPS_PER_EPOCH="${CRPV4_MAX_STEPS_PER_EPOCH:-}"

WANDB_PROJECT="${WANDB_PROJECT:-Spur_SpLiCE}"
WANDB_ENTITY="${WANDB_ENTITY:-gsgrechkin-rptu}"

CRPV4_VARIANTS=(
    "vanilla_patchwise|vanilla|false"
    "vanilla_slots|vanilla|true"
    "sclip_patchwise|sclip|false"
    "sclip_slots|sclip|true"
)
