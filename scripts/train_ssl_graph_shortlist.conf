# Short matched SSL screen. Each record is:
# label|mode|cobalt|graph_variant|min_group_size|text_similarity|coactivation|max_groups|splice_weight

source "${CONFIG_DIR}/train_crp.conf"

SEED="0"
EPOCHS="100"
CRP_AUTO_BUILD_GRAPH="false"
USE_DINO="false"
COBALT="true"
SPLICE_VOCAB="openimages_v7"
SPLICE_VOCAB_SIZE="-1"
CRP_CACHE_PATH="${CRP_CACHE_PATH:-outputs/crp/${DATASET}_train_features_oi_v7_no_dino.pt}"
COBALT_CONCEPTS_PATH="${COBALT_CONCEPTS_PATH:-output/CoBalT/${DATASET}/seed0/concepts.pt}"

# Keep the graph construction fields identical to the completed frozen audits.
CRP_MIN_CONCEPT_FREQUENCY="0.01"
CRP_MAX_CONCEPT_FREQUENCY="0.95"
CRP_PROJECTED_NEIGHBORS="20"
CRP_DINO_NEIGHBORS="50"
CRP_ACTIVATION_DIFFERENCE_QUANTILE="0.85"
CRP_MIN_INTERVENTION_GAIN="5e-4"
CRP_MIN_COVERAGE="0.01"
CRP_GRAPH_TOP_K="3"
CRP_MAX_INDEGREE="10"
CRP_INDEGREE_FACTOR="3.0"
CRP_NULL_TRIALS="32"
CRP_NULL_QUANTILE="0.95"
CRP_SIMILARITY_CHUNK_SIZE="512"
CRP_ORTHOGONAL_TOLERANCE="1e-6"
CRP_USE_RESIDUAL_SPLICE_GATE="true"
CRP_RESIDUAL_SPLICE_SIMILARITY_THRESHOLD="0.25"
CRP_USE_CROSS_FOLD_VALIDATION="true"
CRP_CROSS_FOLD_COUNT="2"
CRP_CROSS_FOLD_MIN_EDGE_PERSISTENCE="0.5"
CRP_USE_COBALT_CONFIDENCE="true"

# This is a short screen, so the relational term is warmed up but not decayed.
CRP_START_EPOCH="10"
CRP_WARMUP_EPOCHS="10"
CRP_DECAY_START_EPOCH="0"
CRP_DECAY_END_EPOCH="0"
CRP_GRAPH_POSITIVES="false"
CRP_TEMPERATURE="0.25"
WANDB_EXTRA_TAGS="machine_cluster,ssl_graph_shortlist,screen_100ep"

SSL_GRAPH_SHORTLIST_VARIANTS=(
    "simclr|none|false|baseline|1|0.80|0.35|0|0"
    "splice_only_g3_t065|crp_relational|false|oi_v7_splice_only_no_dino_g3_t065_c015_k8|3|0.65|0.15|8|2.0"
    "splice_only_g2_t070|crp_relational|false|oi_v7_splice_only_no_dino_g2_t070_c020_k12|2|0.70|0.20|12|2.0"
    "cobalt_g3_t065|crp_relational|true|oi_v7_cobalt_no_dino_g3_t065_c015_k8|3|0.65|0.15|8|2.0"
    "cobalt_g2_t070|crp_relational|true|oi_v7_cobalt_no_dino_g2_t070_c020_k12|2|0.70|0.20|12|2.0"
)
