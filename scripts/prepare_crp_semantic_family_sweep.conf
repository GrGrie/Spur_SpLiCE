# CoBalT-balanced CRPv3 semantic-family frozen audits. Each record is:
# name|minimum_group_size|text_similarity|coactivation|max_selected_groups

source "${CONFIG_DIR}/train_crp.conf"

SEED="0"
PREPARE_ONLY="true"
COBALT="true"
SPLICE_VOCAB="openimages_v7"
SPLICE_VOCAB_SIZE="-1"
CRP_CACHE_PATH="${CRP_CACHE_PATH:-outputs/crp/${DATASET}_train_features_oi_v7.pt}"
COBALT_CONCEPTS_PATH="${COBALT_CONCEPTS_PATH:-output/CoBalT/${DATASET}/seed0/concepts.pt}"
CRP_FORCE_REBUILD="${CRP_FORCE_REBUILD:-false}"
CRP_NULL_TRIALS="${CRP_NULL_TRIALS:-32}"
CRP_USE_RESIDUAL_SPLICE_GATE="true"
CRP_USE_CROSS_FOLD_VALIDATION="true"
CRP_GRAPH_TOP_K="3"
CRP_MAX_INDEGREE="10"
GRAPH_VARIANT_PREFIX="oi_v7_cobalt"

CRP_SWEEP_VARIANTS=(
    "semantic_t075_g1_all|1|0.75|0.00|0"
    "semantic_t070_g1_all|1|0.70|0.00|0"
    "semantic_t065_g1_all|1|0.65|0.00|0"
)
